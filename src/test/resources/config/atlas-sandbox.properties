# =============================================================================
#  Sandbox — the application under test is started in-process by the framework.
#
#  baseUrl and api.baseUrl are deliberately absent: the server binds an
#  ephemeral port, so both URLs are resolved at runtime by AtlasConfig. This is
#  what allows several suites to run concurrently on the same machine.
# =============================================================================

credentials.username=standard_user
credentials.password=atlas_secret

# Pin the port only when a human wants to open the application in a browser:
#   ./mvnw test -Datlas.sandbox.port=8420
# sandbox.port=8420
