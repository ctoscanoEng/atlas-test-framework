# =============================================================================
#  ATLAS — default configuration
#
#  Weakest source of the precedence chain. Every key can be overridden by an
#  environment overlay (atlas-<env>.properties), by an environment variable
#  (ATLAS_TIMEOUT_EXPLICIT=30) or by a system property (-Datlas.browser=firefox).
#
#  Never commit a real secret here: production credentials must arrive from the
#  environment, which is what CI credential stores are for.
# =============================================================================

# ----------------------------------------------------------------- target
env=sandbox

# ----------------------------------------------------------------- browser
browser=chrome
headless=true
remote=false
gridUrl=http://localhost:4444/wd/hub
window.size=1920,1080

# ----------------------------------------------------------------- timing (seconds)
timeout.explicit=15
timeout.pageLoad=40
timeout.script=30
timeout.pollingMillis=200

# ----------------------------------------------------------------- policy
# Try the declared fallback strategies when the primary locator stops matching.
locator.selfHealing=true
# Re-run a failed test at most this many times, and only for environmental failures.
retry.count=1

# ----------------------------------------------------------------- reporting
report.directory=target/atlas-report
report.title=ATLAS — Automation Report
report.author=QA Automation
report.screenshotOnFailure=true
report.screenshotOnStep=false

# ----------------------------------------------------------------- test data
# Fix this value to replay a run with exactly the same synthetic data.
# data.seed=1730000000000

# ----------------------------------------------------------------- sandbox
# The in-process application under test. Keep the bind address on the loopback
# for local runs; inside Docker the browsers live in other containers, so the
# server must listen on every interface and advertise a resolvable hostname:
#   ATLAS_SANDBOX_BIND_ADDRESS=0.0.0.0  ATLAS_SANDBOX_ADVERTISED_HOST=atlas-tests
sandbox.bindAddress=127.0.0.1
sandbox.advertisedHost=127.0.0.1
sandbox.port=0

# ----------------------------------------------------------------- credentials
credentials.username=standard_user
credentials.password=atlas_secret
